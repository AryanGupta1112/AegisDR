apiVersion: v1
kind: Namespace
metadata:
  name: aegisdr-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: aegisdr-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: aegisdr-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegisdr-dashboard-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: aegisdr-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegisdr-dashboard-cluster-view
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegisdr-dashboard-cluster-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aegisdr-dashboard-cluster-view
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: aegisdr-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: aegisdr-dashboard
spec:
  replicas: 1
  selector:
    matchLabels: {app: headlamp}
  template:
    metadata:
      labels: {app: headlamp}
    spec:
      serviceAccountName: headlamp
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
          args: ["-in-cluster", "-plugins-dir=/headlamp/plugins"]
          ports:
            - {name: http, containerPort: 4466}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: aegisdr-dashboard
spec:
  selector: {app: headlamp}
  ports:
    - {name: http, port: 80, targetPort: http}
