apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisdr
spec:
  ingressClassName: nginx
  tls:
    - hosts: [aegisdr.example.com]
      secretName: aegisdr-tls
  rules:
    - host: aegisdr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegisdr
                port: {name: http}
