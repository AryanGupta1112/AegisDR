apiVersion: v1
kind: Service
metadata:
  name: aegisdr-postgres
spec:
  clusterIP: None
  selector: {app: aegisdr-postgres}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegisdr-postgres
spec:
  serviceName: aegisdr-postgres
  replicas: 1
  selector:
    matchLabels: {app: aegisdr-postgres}
  template:
    metadata:
      labels: {app: aegisdr-postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_USER, value: aegis}
            - {name: POSTGRES_DB, value: aegis_demo}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: aegisdr-credentials, key: postgres-password}
          ports:
            - {name: postgres, containerPort: 5432}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: [pg_isready, -U, aegis, -d, aegis_demo]
            periodSeconds: 5
          volumeMounts:
            - {name: database, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
