apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aegisdr-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisdr
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: aegisdr
  template:
    metadata:
      labels:
        app: aegisdr
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform
          image: aegisdr-platform:release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AEGIS_DATA_DIR
              value: /data
            - name: AEGIS_LOCAL_MODE
              value: "false"
            - name: AEGIS_ORIGINS
              value: https://aegisdr.example.com
            - name: AEGIS_API_TOKEN_FILE
              value: /run/aegis/api-token
            - name: AEGIS_POSTGRES_ENV
              value: AEGIS_DB_DEMO
            - name: AEGIS_DB_DEMO
              valueFrom:
                secretKeyRef:
                  name: aegisdr-credentials
                  key: database-url
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          # Worker errors affect readiness; they must not restart an active restore.
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: credentials
              mountPath: /run/aegis
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aegisdr-data}
        - name: credentials
          secret:
            secretName: aegisdr-credentials
            defaultMode: 0440
            items:
              - key: api-token
                path: api-token
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aegisdr
spec:
  selector: {app: aegisdr}
  ports:
    - name: http
      port: 8080
      targetPort: http
